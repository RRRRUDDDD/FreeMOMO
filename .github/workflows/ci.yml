name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rootless

permissions:
  contents: read

concurrency:
  group: freemomo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS: 36.1.0

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        # actions/setup-java v5.7.0
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        # android-actions/setup-android v4.0.1
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Run native host tests
        run: sh native-jni/test-host.sh "$RUNNER_TEMP/freemomo-native-tests"

      - name: Check rootless build scripts
        run: python -m py_compile rootless/build_rootless.py rootless/custom_repack.py rootless/verify_artifacts.py

      - name: Run unit tests, lint, and Android builds
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug assembleRelease --no-daemon --console=plain
