plugins {
    id 'com.android.application' version '8.13.0'
}

def outputRoot = new File(providers.gradleProperty('smokeOutput').get())
def nativeRoot = new File(providers.gradleProperty('smokeNativeLibs').get())
if (!outputRoot.isAbsolute() || !nativeRoot.isAbsolute()) {
    throw new GradleException('Use absolute smokeOutput and smokeNativeLibs paths')
}
layout.buildDirectory.set(outputRoot)
android {
    namespace = 'com.rud.freemomo.nativesmoke'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.rud.freemomo.nativesmoke'
        minSdk = 28
        targetSdk = 36
        versionCode = 1
        versionName = '1.0-local'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDirs = [nativeRoot]
    packaging.jniLibs.useLegacyPackaging = true
    packaging.jniLibs.keepDebugSymbols += '**/libfreemomo_native.so'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
